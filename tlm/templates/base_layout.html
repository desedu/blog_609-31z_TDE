{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Default title{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    <header class="site-header">
        <div class="header-container">
            <a href="/" class="logo">
                <img src="{% static 'img/logo.jpg' %}" alt="Default Logo" style="height: 40px;">
            </a>
            
            <nav class="main-nav">
                <ul class="nav-list">
                    <li><a href="/">Главная</a></li>
                    <li><a href="{% url 'article_list' %}">Все статьи</a></li>
                    <li><a href="/about/">О сайте</a></li>
                    
                    {% if user.is_authenticated %}
                        <li>
                            <form class="form-logout" action="/accounts/logout/" method="post">
                                {% csrf_token %}
                                <button type="submit">Выйти ({{ user.username }})</button>
                            </form>
                        </li>
                    {% else %}
                        <li><a href="{% url 'login' %}">Войти</a></li>
                    {% endif %}
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock content %}
    </div>

</body>
</html>
