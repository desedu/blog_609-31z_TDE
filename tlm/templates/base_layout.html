{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Default title{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-light">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <a class="navbar-brand" href="{% url 'homepage' %}">
                    <img src="{% static 'images/logo.jpg' %}" alt="Logo" style="height: 30px; border-radius: 5px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav w-100 mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'about' %}">About</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'articles:list' %}">Articles</a>
                        </li>
                        
                        {% if user.is_authenticated %}
                            <li class="nav-item ms-auto">
                                <form class="form d-flex align-items-center h-100" action="{% url 'accounts:logout' %}" method="post">
                                    {% csrf_token %}
                                    <button class="btn btn-outline-primary btn-sm" type="submit">Logout</button>
                                </form>
                            </li>
                        {% else %}
                            <li class="nav-item ms-auto">
                                <a class="btn btn-outline-primary btn-sm" href="{% url 'accounts:login' %}">Login</a>
                            </li>
                            <li class="nav-item ms-3">
                                <a class="btn btn-primary btn-sm" href="{% url 'accounts:signup' %}">Sign Up</a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    
    <main class="container">
        {% block content %}{% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
